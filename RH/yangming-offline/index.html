<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1b0b12"><title>羊名立万 · 春节活动离线演示</title>
<!-- POLICY -->

<body><div class="room-glow"></div><main class="preview"><div class="device-stage" id="deviceStage"><div class="phone" id="phone"><div class="camera"></div><div class="game" id="game">
<header class="header" data-background><button class="icon-btn" data-action="home" aria-label="返回活动首页">‹</button><div class="event-name">羊名立万 <small>新春特别活动</small></div><button class="date-pill" data-action="calendar" id="dateLabel"></button><div class="header-tools"><button data-action="inventory" class="header-stat" title="已获得的奖励"><span id="ownedCount">0</span><small>活动球员</small></button><button class="icon-btn" data-action="match" aria-label="本地比赛" title="本地比赛">⚽</button><button class="icon-btn" data-action="rules" aria-label="活动规则">?</button></div></header>
<nav class="tabs" aria-label="活动板块" data-background><button data-action="tab" data-tab="gifts" class="active">新春见面礼</button><button data-action="tab" data-tab="red">踢出开门红</button><button data-action="tab" data-tab="stars">拜年有名堂</button><button data-action="tab" data-tab="legends">三羊开泰</button></nav>
<section id="content" data-background></section><footer class="footer" data-background><span id="footerText"></span><button data-action="inventory">我的奖励 <span>›</span></button></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div class="modal-shade" id="modalShade" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-heading"><div><small>羊名立万 · 春节活动</small><h2 id="modalTitle"></h2></div><button id="closeModal" class="icon-btn" data-action="close" aria-label="关闭弹窗">×</button></header><div id="modalContent"></div></section></div>
</div><div class="home-bar"></div></div></div>
<div class="studio-strip"><span><i></i> 单机离线演示 <em id="saveStatus">进度保存在本机</em></span><div><button data-action="calendar">切换演示日期</button><button data-action="match">本地比赛</button><button data-action="reset">重新体验</button></div></div><p class="rotate-tip">横屏浏览可获得更大的活动画面</p></main>
