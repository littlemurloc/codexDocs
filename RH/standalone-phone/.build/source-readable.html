<script>
(function(global){
  'use strict';
  const doc=global.document;
  const BOOT=global.__H5_EDITOR_BOOT__||{};
  const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  const clone=o=>JSON.parse(JSON.stringify(o));
  const finite=n=>typeof n==='number'&&Number.isFinite(n);
  const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const token=s=>String(s??'').trim().replace(/[^a-zA-Z0-9_.:/-]+/g,'-').replace(/^-+|-+$/g,'');
  const safeValue=s=>typeof s==='string'&&s.length<500&&!/[;{}<>]|url\s*\(|expression\s*\(/i.test(s);
  const safeImage=s=>typeof s==='string'&&s.length<30000000&&/^data:image\/(?:png|jpe?g|webp|gif|avif|svg\+xml);base64,[a-zA-Z0-9+/=\r\n]+$/i.test(s);
  const variablesIn=s=>[...new Set([...String(s).matchAll(/\{([a-zA-Z_][\w.]*)\}/g)].map(m=>m[1]))];
  const templates=new Map();
  const meta=new WeakMap();
  let config={version:1,patches:{},templates:{}};
  let lastRoot=null;
  let catalogWarnings=[];
  let activeOwner=null;
  const styleFields={fontSize:'font-size',fontFamily:'font-family',fontWeight:'font-weight',lineHeight:'line-height',color:'color',textAlign:'text-align',z:'z-index',objectFit:'object-fit',objectPosition:'object-position',backgroundSize:'background-size',backgroundPosition:'background-position'};
  function normalizeConfig(input){
    const value=input&&typeof input==='object'?input:{};
    const out={version:1,patches:{},templates:{}};
    if(value.patches&&typeof value.patches==='object'&&!Array.isArray(value.patches)){
      Object.entries(value.patches).slice(0,10000).forEach(([id,raw])=>{
        if(!id||id.length>250||!raw||typeof raw!=='object'||['__proto__','constructor','prototype'].includes(id))return;
        const p={};
        for(const k of ['x','y'])if(finite(raw[k])&&Math.abs(raw[k])<=100000)p[k]=raw[k];
        for(const k of ['width','height'])if(finite(raw[k])&&raw[k]>=1&&raw[k]<=50000)p[k]=raw[k];
        if(finite(raw.z)&&Math.abs(raw.z)<=9999)p.z=Math.round(raw.z);
        if(finite(raw.fontSize)&&raw.fontSize>=1&&raw.fontSize<=1000)p.fontSize=raw.fontSize;
        if((finite(raw.fontWeight)&&raw.fontWeight>=100&&raw.fontWeight<=1000)||['normal','bold','bolder','lighter'].includes(raw.fontWeight))p.fontWeight=raw.fontWeight;
        if(typeof raw.fontFamily==='string'&&safeValue(raw.fontFamily))p.fontFamily=raw.fontFamily;
        if(finite(raw.lineHeight)&&raw.lineHeight>=0.2&&raw.lineHeight<=20)p.lineHeight=raw.lineHeight;
        else if(typeof raw.lineHeight==='string'&&/^(?:normal|\d+(?:\.\d+)?(?:px|em|%|))$/.test(raw.lineHeight))p.lineHeight=raw.lineHeight;
        if(typeof raw.color==='string'&&safeValue(raw.color)&&(/^(?:#[a-f\d]{3,8}|rgba?\([\d\s.,%/]+\)|hsla?\([\d\s.,%/deg]+\)|[a-z]+)$/i.test(raw.color)))p.color=raw.color;
        if(['left','center','right','justify','start','end'].includes(raw.textAlign))p.textAlign=raw.textAlign;
        if(['contain','cover','fill','none','scale-down'].includes(raw.objectFit))p.objectFit=raw.objectFit;
        if(typeof raw.objectPosition==='string'&&safeValue(raw.objectPosition)&&/^[\d.\-%px\sleftcenterrighttopbottom]+$/i.test(raw.objectPosition))p.objectPosition=raw.objectPosition;
        for(const k of ['backgroundSize','backgroundPosition'])if(typeof raw[k]==='string'&&safeValue(raw[k])&&/^[\d.\-%px\sautocontaincoverleftcenterrighttopbottom]+$/i.test(raw[k]))p[k]=raw[k];
        if(typeof raw.text==='string'&&raw.text.length<=50000)p.text=raw.text;
        const image=typeof raw.image==='string'?raw.image:raw.image&&typeof raw.image.src==='string'?raw.image.src:null;
        if(image&&safeImage(image))p.image=image;
        if(['background','image'].includes(raw.target))p.target=raw.target;
        else if(raw.image&&raw.image.target==='background')p.target='background';
        for(const k of ['hidden','locked'])if(typeof raw[k]==='boolean')p[k]=raw[k];
        out.patches[id]=p;
      });
    }
    if(value.templates&&typeof value.templates==='object'&&!Array.isArray(value.templates))Object.entries(value.templates).slice(0,10000).forEach(([key,row])=>{
      const text=typeof row==='string'?row:row&&row.text;
      if(key&&key.length<=250&&typeof text==='string'&&text.length<=50000&&!['__proto__','constructor','prototype'].includes(key))out.templates[key]={text};
    });
    return out;
  }
  function validTemplate(candidate,defaultText){
    const required=variablesIn(defaultText),actual=variablesIn(candidate);
    return required.every(k=>actual.includes(k))&&actual.every(k=>required.includes(k));
  }
  function sourceTemplate(key,defaultText,patchText){
    const candidate=config.templates[key]?.text??patchText;
    return typeof candidate==='string'&&validTemplate(candidate,defaultText)?candidate:defaultText;
  }
  function renderText(source,vars){return String(source).replace(/\{([a-zA-Z_][\w.]*)\}/g,(_,key)=>own(vars,key)?String(vars[key]??''):'{'+key+'}');}
  function registerTemplate(key,defaultText,vars={}){
    const clean={};
    if(vars&&typeof vars==='object')for(const [k,v] of Object.entries(vars))if(/^[a-zA-Z_][\w.]*$/.test(k)&&['string','number','boolean'].includes(typeof v))clean[k]=v;
    const entry={key:String(key),defaultText:String(defaultText),variables:clean};
    templates.set(entry.key,entry);return entry;
  }
  function template(key,defaultText,vars={}){
    const row=registerTemplate(key,defaultText,vars),source=sourceTemplate(row.key,row.defaultText,config.patches[row.key]?.text);
    return '<span data-edit-id="'+escapeHTML(row.key)+'" data-edit-template="'+escapeHTML(row.key)+'" data-edit-default-template="'+escapeHTML(row.defaultText)+'" data-edit-vars="'+escapeHTML(JSON.stringify(row.variables))+'">'+escapeHTML(renderText(source,row.variables))+'</span>';
  }
  function bindTemplate(element,key,defaultText,vars={}){
    if(!element)return;
    const row=registerTemplate(key,defaultText,vars);
    element.dataset.editId=row.key;element.dataset.editTemplate=row.key;element.dataset.editDefaultTemplate=row.defaultText;element.dataset.editVars=JSON.stringify(row.variables);
    const text=renderText(sourceTemplate(row.key,row.defaultText,config.patches[row.key]?.text),row.variables);
    if(element.textContent!==text)element.textContent=text;
  }
  const player3=['van-dijk','carvajal','pirlo','de-bruyne','baggio','griezmann','milito','julio-cesar'];
  const player4=['pele','maradona','messi'];
  const groupClasses=['event-brand','login-daily-main','reward-panel','opening-daily-panel','opening-rewards','opening-level-combination','opening-level-status','opening-level-reward','greeting-figures','greeting-milestones','greeting-milestone','greeting-visual','greeting-story-area','kings-acquisitions','kings-acquire-card','kings-mini-card','kings-photo-panel','kings-story','kings-upgrade-panel'];
  const candidateSelector=['button','img','h1','h2','h3','h4','p','figcaption','[data-edit-id]','[data-edit-template]','[data-opening-total]','[data-opening-level-name]','[data-opening-level-progress]','[data-opening-next-level]','[data-opening-pending]','[data-mode-status]','.greeting-light-progress strong','.greeting-milestone-progress','#opening-progress',...groupClasses.map(c=>'.'+c)].join(',');
  const actions=['chapter','gift','card','claim','opening-card','opening-card-claim','mode-status','greeting-light','greeting-reveal','greeting-quiz','greeting-claim','greeting-upgrade','greeting-page','greeting-milestone','greeting-answer','greeting-select','kings-player','kings-page','kings-acquire','kings-buy','kings-stage','kings-challenge','kings-result','kings-exchange','kings-phase'];
  function scopeOf(el){
    const explicit=el.closest('[data-edit-scope]');
    if(explicit)return token(explicit.dataset.editScope)||'dialog/current';
    const modal=el.closest('dialog');
    if(modal)return 'dialog/'+(token(modal.dataset.editView)||'current');
    const g=el.closest('[data-greeting-index]');
    if(g){const i=Number(g.dataset.greetingIndex);return i<0?'c3/overview':'c3/player/'+(player3[i]||'unknown');}
    const k=el.closest('[data-kings-index]');
    if(k){const i=Number(k.dataset.kingsIndex);return i===0?'c4/claim':'c4/battle/'+(player4[i-1]||'unknown');}
    if(el.closest('.top-chrome'))return 'shared/navigation';
    if(el.closest('#opening-scroll'))return 'c2';
    if(el.closest('#greeting-scroll'))return 'c3';
    if(el.closest('#kings-scroll'))return 'c4';
    if(el.closest('#reward-scroll'))return 'c1';
    return 'shared';
  }
  function semanticRole(el){
    if(el.dataset.editTemplate)return token(el.dataset.editTemplate);
    for(const key of actions)if(el.hasAttribute('data-'+key)){
      let value=el.getAttribute('data-'+key);
      if(key.startsWith('greeting-')&&/^\d+$/.test(value))value=player3[Number(value)]||value;
      if(['kings-player','kings-acquire','kings-challenge','kings-exchange'].includes(key)&&/^\d+$/.test(value))value=player4[Number(value)]||value;
      return token(key+(value!==''?'/'+value:''));
    }
    for(const key of ['login-daily','opening-daily','opening-level-claim','opening-total','opening-level-name','opening-level-progress','opening-next-level','opening-pending','overview','home','records','close','greeting-rules','kings-rules','kings-unlock'])if(el.hasAttribute('data-'+key))return key;
    const classes=[...el.classList].filter(c=>!/^is-|^has-|^cursor-|^greeting-answered$/.test(c));
    return token(classes.find(c=>c!=='common-action'&&c!=='art-button')||el.id||el.tagName.toLowerCase());
  }
  function isGroup(el){return el.dataset.editKind==='group'||groupClasses.some(c=>el.classList.contains(c));}
  function skipAuto(el){
    if(el.closest('[data-h5-editor-ui]')||el.classList.contains('sr-only')||el.closest('.sr-only')||el.matches('.greeting-demo-controls *'))return true;
    if(el.closest('.greeting-figures')&&!el.classList.contains('greeting-figures'))return true;
    const button=el.closest('button');
    if(button&&button!==el&&!el.dataset.editTemplate)return true;
    const mini=el.closest('.kings-mini-card');
    if(mini&&mini!==el&&!el.hasAttribute('data-edit-id'))return true;
    return false;
  }
  function catalog(root=doc){
    if(!root||!root.querySelectorAll)return [];
    const nodes=[...(root.matches?.(candidateSelector)?[root]:[]),...root.querySelectorAll(candidateSelector)];
    const seen=new Map(),warnings=[];
    for(const el of nodes){
      if(skipAuto(el)&&!el.hasAttribute('data-edit-id'))continue;
      let id=el.dataset.editId;
      if(!id){
        if(el.dataset.editTemplate)id=el.dataset.editTemplate;
        else{
          const scope=scopeOf(el),role=semanticRole(el);
          const group=el.parentElement?.closest('[data-edit-id]');
          const parentId=group&&isGroup(group)&&scopeOf(group)===scope?group.dataset.editId:scope;
          id=parentId+'/'+role;
          if(el.classList.contains('reward-panel')){
            const key=el.querySelector('[data-card]')?.dataset.card?.split(',')[0];
            if(key!==undefined)id='c1/reward-group/'+key;
          }
          if(el.classList.contains('greeting-milestone')){
            const key=el.querySelector('[data-greeting-milestone]')?.dataset.greetingMilestone;
            if(key!==undefined)id='c3/overview/milestone/'+(key==='0'?'four':'eight');
          }
        }
        if(!id||seen.has(id)||root.querySelector('[data-edit-id="'+String(id).replace(/["\\]/g,'\\$&')+'"]')){warnings.push('缺少唯一语义键：'+scopeOf(el)+' / '+semanticRole(el));continue;}
        el.dataset.editId=id;el.dataset.editAuto='true';
      }
      if(seen.has(id)&&seen.get(id)!==el){warnings.push('重复编辑ID：'+id);continue;}
      seen.set(id,el);
    }

    function personalMarkup(p,i){
      const progress=state.players[i],open=opened(i);
      const id='c3/player/'+i;
      const title=progress.solved?dynamic(id+'/name',p.name):text(id+'/title',p.title);
      let image,copy;
      if(progress.solved){
        image='<div class="greeting-revealed-card"'+edit(id+'/reward','group')+'><img src="'+cardArt()+'" alt="'+p.name+'球员奖励占位卡，无能力数值" draggable="false"'+edit(id+'/reward/card','image')+' data-edit-asset="v2/reward-placeholder.png"><span'+edit(id+'/reward/name','dynamic')+'>'+p.name+'</span></div>';
        copy='<p class="greeting-birthday"'+edit(id+'/birthday','dynamic')+'>'+p.birthday+'出生 · 生肖：羊</p><p class="greeting-story">'+text(id+'/story',p.story)+'</p>';
      }else{
        image='<div class="greeting-shirt" data-open="'+open+'" style="--shirt-offset-y:'+shirtOffsets[i]+'px"'+edit(id+'/clue','group')+'><img src="'+shirtArt(i)+'" alt="隐藏姓名的背面球衣，号码'+p.number+'" draggable="false"'+edit(id+'/clue/shirt','image')+' data-edit-asset="chapter3-v2/shirt-'+i+'.png"></div>';
        if(!open){
          const message=state.phase==='ended'?'活动已结束':state.phase==='before'?'活动未开放':'正月{date}开放';
          copy='<p class="greeting-story-hint">'+text(id+'/unopened/message/'+state.phase,message,{date:dates[i]})+'<br>'+text(id+'/unopened/catch-up/'+state.phase,state.phase==='ended'?'已完成的领取与点亮进度保留':state.phase==='before'?'开放后可寻找拜年来客':'已开放任务可补做到正月十四')+'</p>';
        }else{
          copy='<p class="greeting-story">'+text(id+'/story',p.story)+'</p>';
        }
      }
      const inactiveStatus=state.phase==='ended'?'ended':'locked';
      const claimStatus=progress.claimed?'claimed':open&&progress.solved?'available':inactiveStatus;
      const claimHintState=progress.claimed?'claimed':!active()?state.phase:!open?'future':progress.solved?'available':'need-answer';
      const claimHint=progress.claimed?'活动球员已领取':!active()?(state.phase==='before'?'活动未开放':'活动已结束，历史进度保留'):!open?'正月{date}开放，答对身份后领取':progress.solved?'点击获得这位活动球员':'猜对他的身份后可领取';
      const upgradeStatus=progress.upgraded?'claimed':open&&progress.played?'available':inactiveStatus;
      const upgradeHintState=progress.upgraded?'claimed':!active()?state.phase:!open?'future':!progress.claimed?'need-player':!progress.played?'need-match':'available';
      const upgradeCondition=progress.upgraded?'个人升级已兑换':!progress.claimed?'领取球员后，带他完成任意一场游戏':!progress.played?'带他完成任意一场游戏':'比赛已完成，可兑换升级';

    openDialog('新春见面礼 · 活动规则','<img class="dialog-gift" src="'+asset('hero-gift.png')+'" alt="登录礼盒"><p class="dialog-copy">腊月廿四至正月十四，每日登录可领取一份见面礼。<br>首屏圆形礼盒点击即可领取，共21份，与日期限定奖励独立。<br><br>日期限定奖励从腊月廿四至正月初八，每天开放一个版面，共15天。<br>除夕6份，其他日期每天2份，共34份。<br>正月初九至十四不设日期限定奖励。<br>未到开放日期时按钮为灰色，点击可查看开放日期。<br>日期奖励仅限当天领取；错过后已过期，不可补领。<br>具体奖励内容待定。</p><button type="button" class="dialog-action" data-browse>查看日期限定奖励</button>');
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.hasAttribute('data-gm-toggle')){gmMenu(byId('gm-menu').hidden);return;}
    if(button.hasAttribute('data-gm-match')){gmMatch();return;}
    if(button.hasAttribute('data-gm-reset')){gmReset();return;}
    if(button.hasAttribute('data-gm-next')){gmNextDay();return;}
    gmMenu(false);
    if(kings.handleClick(button))return;
    if(greeting.handleClick(button))return;
    if(button.hasAttribute('data-close')){closeDialog();return;}
    if(button.hasAttribute('data-browse')){browse();return;}
    if(button.hasAttribute('data-home')){home();return;}
    if(button.hasAttribute('data-overview')){overview();return;}
    if(button.hasAttribute('data-records')){showRecords();return;}
    if(button.dataset.chapter!==undefined){switchChapter(Number(button.dataset.chapter));return;}
    if(button.hasAttribute('data-opening-browse')){browseOpening();return;}
    if(button.hasAttribute('data-opening-daily')){claimOpeningDaily();return;}
    if(button.hasAttribute('data-login-daily')){claimLoginDaily();return;}
    if(button.hasAttribute('data-opening-level-claim')){claimOpeningLevels();return;}
    if(button.dataset.openingCard!==undefined){showOpeningCard(Number(button.dataset.openingCard));return;}
    if(button.dataset.openingCardClaim!==undefined){claimOpeningCard(Number(button.dataset.openingCardClaim));return;}
    const pair=button.dataset.gift||button.dataset.card||button.dataset.claim;if(!pair)return;
    const [group,slot]=pair.split(',').map(Number);
    if(button.dataset.card!==undefined)showCard(group,slot);else claim(group,slot);
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape')gmMenu(false);});
  dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)closeDialog();}});
  dialog.addEventListener('close',()=>{const target=focusOnClose||lastFocus;focusOnClose=null;if(target&&target.isConnected&&!target.closest('[hidden]'))target.focus({preventScroll:true});});
  function setupScroll(element,index){
    let drag=null,scrollTimer=0;
    element.addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'&&event.button===0&&!dialog.open)drag={id:event.pointerId,x:event.clientX,left:element.scrollLeft,moved:false};});
    element.addEventListener('pointermove',event=>{
      if(!drag||drag.id!==event.pointerId)return;
      const delta=event.clientX-drag.x;
      if(!drag.moved&&Math.abs(delta)>7){drag.moved=true;element.classList.add('is-dragging');element.setPointerCapture(event.pointerId);}
      if(drag.moved){event.preventDefault();element.scrollLeft=drag.left-delta/scale;}
    });
    function endDrag(){if(!drag)return;if(drag.moved){lastDragEnd=Date.now();element.classList.remove('is-dragging');try{element.releasePointerCapture(drag.id);}catch(error){}}drag=null;}
    element.addEventListener('pointerup',endDrag);element.addEventListener('pointercancel',endDrag);
    element.addEventListener('pointerleave',()=>{if(drag&&!drag.moved)drag=null;});
    element.addEventListener('click',event=>{if(Date.now()-lastDragEnd<300){event.preventDefault();event.stopImmediatePropagation();}},true);
    element.addEventListener('wheel',event=>{
      if(event.ctrlKey||dialog.open)return;
      const delta=Math.abs(event.deltaX)>Math.abs(event.deltaY)?event.deltaX:event.deltaY;
      const end=element.scrollWidth-element.clientWidth;
      if((delta>0&&element.scrollLeft<end-1)||(delta<0&&element.scrollLeft>1)){event.preventDefault();element.scrollLeft+=delta/scale;}
    },{passive:false});
    element.addEventListener('scroll',()=>{
      // Focus may scroll a tall transparent image's box vertically; this track only browses horizontally.
      if(element.scrollTop)element.scrollTop=0;
      if(activeChapter!==index||element.hidden)return;
      scrollPositions[index]=element.scrollLeft;
      clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const range=element.scrollWidth-element.clientWidth;const name=chapterNames[index];element.setAttribute('aria-label',name+'，已横向浏览至'+(range>0?Math.round(element.scrollLeft/range*100):0)+'%，支持方向键浏览');},100);
    });
    element.addEventListener('keydown',event=>{
      if(dialog.open)return;
      if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();element.scrollBy({left:event.key==='ArrowRight'?803:-803,behavior:behavior()});}
      else if(event.key==='Home'){event.preventDefault();element.scrollTo({left:0,behavior:behavior()});}
      else if(event.key==='End'){event.preventDefault();element.scrollTo({left:element.scrollWidth,behavior:behavior()});}
    });
  }
  window.H5EditorRuntime={
    getState:snapshot,
    navigate({chapter=activeChapter,page=0,ratio}={}){
      if([0,1,2,3].includes(Number(chapter)))switchChapter(Number(chapter));
      if(Number.isFinite(ratio)){const e=currentViewport();e.scrollTo({left:(e.scrollWidth-e.clientWidth)*Math.max(0,Math.min(100,ratio))/100,behavior:'instant'});editorRefresh();return;}
      const targets=activeChapter===0?[stage.querySelector('.hero'),...panels.querySelectorAll('.date-panel')]:activeChapter===1?[stage.querySelector('.opening-intro'),stage.querySelector('.opening-daily-panel'),stage.querySelector('.opening-rewards'),stage.querySelector('.opening-level-combination')]:activeChapter===2?[...greetingViewport.querySelectorAll('.greeting-page')]:[...kingsViewport.querySelectorAll('.kings-page')];
      const target=targets[Number(page)]||targets[0];if(target)currentViewport().scrollTo({left:target.offsetLeft,behavior:'instant'});editorRefresh();
    },
    openView({view='rules',payload={}}={}){
      if(view==='close'){closeDialog();return;}
      if(view==='rules'){overview();return;}
      if(view==='records'){showRecords();return;}
      if(view==='login-date'){applyLogin({type:'set-day',day:Number(payload.day)||1});return;}
      if(view==='opening-match'){applyOpening({type:'match',mode:payload.mode||'attack',valid:true,eventId:'editor-'+Date.now()});return;}
      if(view==='opening-next-day'){applyOpening({type:'next-day'});return;}
      if(view==='greeting-match'){greeting.simulateMatch?.(payload.players||[]);return;}
      if(view==='greeting-day'){greeting.setDemoDay?.(payload.day||8);return;}
      if(view==='quiz'){switchChapter(2);greeting.previewView?.({view:'quiz',player:payload.player||0});return;}
      if(view==='kings-buy'){switchChapter(3);kings.handleClick({dataset:{kingsAcquire:'2'}});return;}
      if(view==='kings-challenge'){switchChapter(3);kings.handleClick({dataset:{kingsChallenge:String(payload.player||0)}});return;}
    }
  };
  makePanels();renderLoginDaily();renderOpening();renderChapter();setupScroll(viewport,0);setupScroll(openingViewport,1);setupScroll(greetingViewport,2);setupScroll(kingsViewport,3);sizeCanvas();new ResizeObserver(sizeCanvas).observe(stage);
})();

</script>
